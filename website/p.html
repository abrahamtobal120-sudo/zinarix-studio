<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Zinarix · Control remoto</title>
    <meta name="robots" content="noindex" />
    <meta name="referrer" content="no-referrer" />
    <meta name="theme-color" content="#0f1115" />
    <link rel="icon" type="image/png" href="/assets/favicon.png" />
    <style>
      html, body { margin: 0; height: 100%; background: #0f1115; color: #e8e8ea;
        font: 16px/1.45 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
      main { min-height: 100%; display: flex; flex-direction: column; align-items: center;
        justify-content: center; gap: 14px; padding: 24px; box-sizing: border-box; text-align: center; }
      img { width: 56px; height: 56px; }
      h1 { font-size: 20px; margin: 0; }
      p { margin: 0; color: #a3a6ad; max-width: 340px; }
      .spin { width: 28px; height: 28px; border: 3px solid #2a2e36; border-top-color: #7aa2ff;
        border-radius: 50%; animation: s 0.9s linear infinite; }
      @keyframes s { to { transform: rotate(360deg); } }
      button { font: inherit; padding: 10px 18px; border-radius: 10px; border: 1px solid #2a2e36;
        background: #1a1d24; color: inherit; }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <main>
      <img src="/assets/logo.svg" alt="" />
      <h1 id="title">Buscando tu computadora…</h1>
      <p id="lead">Abriendo Zinarix Studio en su dirección actual.</p>
      <div class="spin" id="spin"></div>
      <button id="retry" hidden>Intentar otra vez</button>
    </main>
    <script src="/p.js"></script>
  </body>
</html>
