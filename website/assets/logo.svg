<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38e1ff"/>
      <stop offset="0.45" stop-color="#2f6bff"/>
      <stop offset="1" stop-color="#8b3dff"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#bff6ff"/>
      <stop offset="0.5" stop-color="#7aa8ff"/>
      <stop offset="1" stop-color="#c9a8ff"/>
    </linearGradient>
    <linearGradient id="ribbon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5fe9ff"/>
      <stop offset="0.5" stop-color="#3b6bff"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="digit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9ff3ff"/>
      <stop offset="1" stop-color="#2f7bff"/>
    </linearGradient>
    <radialGradient id="hole" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#0d1438"/>
      <stop offset="1" stop-color="#050818"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="9" result="b1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="b2"/>
      <feMerge><feMergeNode in="b1"/><feMergeNode in="b2"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Z body: top bar, diagonal, bottom bar (italic) -->
  <g filter="url(#glow)">
    <path d="M118 36 H462 L420 112 H252 L176 112 Z" fill="url(#neon)" stroke="url(#edge)" stroke-width="5" stroke-linejoin="round"/>
    <path d="M330 112 H420 L178 400 H88 Z" fill="url(#neon)" stroke="url(#edge)" stroke-width="5" stroke-linejoin="round"/>
    <path d="M92 400 H436 L394 476 H50 Z" fill="url(#neon)" stroke="url(#edge)" stroke-width="5" stroke-linejoin="round"/>
  </g>

  <!-- the two openings of the figure-eight (teardrops along the diagonal) -->
  <path d="M300 122 C 236 124, 196 170, 206 226 C 214 262, 250 268, 268 252 C 302 222, 326 160, 300 122 Z" fill="url(#hole)"/>
  <path d="M226 400 C 288 398, 326 352, 318 300 C 312 266, 278 258, 258 272 C 222 300, 198 362, 226 400 Z" fill="url(#hole)"/>

  <!-- flowing S ribbon: neon tube with a bright core -->
  <g filter="url(#soft)" fill="none" stroke-linecap="round">
    <path d="M372 112 C 230 116, 176 190, 214 236 C 246 272, 296 262, 300 300 C 306 358, 262 398, 150 400" stroke="url(#ribbon)" stroke-width="16"/>
    <path d="M372 112 C 230 116, 176 190, 214 236 C 246 272, 296 262, 300 300 C 306 358, 262 398, 150 400" stroke="#eafcff" stroke-width="3.5" opacity="0.9"/>
    <path d="M300 122 C 326 160, 302 222, 268 252" stroke="url(#ribbon)" stroke-width="7" opacity="0.9"/>
    <path d="M258 272 C 222 300, 198 362, 226 400" stroke="url(#ribbon)" stroke-width="7" opacity="0.9"/>
  </g>

  <!-- 0 / 1 -->
  <g filter="url(#soft)" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-weight="700" text-anchor="middle" fill="url(#digit)" stroke="#d6fbff" stroke-width="1.5">
    <text x="256" y="214" font-size="74">0</text>
    <text x="268" y="362" font-size="74">1</text>
  </g>
</svg>
