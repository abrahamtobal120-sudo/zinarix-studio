# Keeps the GitHub Actions and the npm packages up to date. The workflows pin each action
# to a commit SHA (with the version in a comment); Dependabot updates both.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']

  # npm (pnpm workspace): security fixes and minor/patch updates, grouped into one PR a week.
  # Majors stay manual: they need a look at the changelog first.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-minor:
        update-types: [minor, patch]
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]
