name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      OMNI_NO_KEYCHAIN: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm catalog:check
      - run: node scripts/sign-catalog.mjs verify
      # Known-vulnerable dependencies that ship in the app (dev/build tools excluded).
      - run: pnpm audit --prod --audit-level=high
      - run: pnpm vitest run --coverage
      # The local launcher (pnpm desktop:install) installs and uninstalls cleanly on Windows.
      - name: Local launcher (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          node apps/desktop/scripts/install-local.mjs
          $dir = Join-Path $env:LOCALAPPDATA 'zinarix-studio-dev'
          if (-not (Test-Path "$dir\bin\zinarix-studio.cmd")) { throw 'launcher missing' }
          $lnk = Join-Path ([Environment]::GetFolderPath('Programs')) 'Zinarix Studio (dev).lnk'
          if (-not (Test-Path $lnk)) { throw 'start menu shortcut missing' }
          if (-not ([Environment]::GetEnvironmentVariable('Path', 'User') -split ';' -contains "$dir\bin")) { throw 'not on PATH' }
          node apps/desktop/scripts/install-local.mjs --uninstall
          if ((Test-Path $dir) -or (Test-Path $lnk)) { throw 'still installed' }
