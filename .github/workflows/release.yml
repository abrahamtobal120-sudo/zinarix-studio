name: Release

# Push a tag like v0.3.0 to build installers for Windows, macOS and Linux
# and attach them to a GitHub release.
#
# Flow: create-release (draft) -> build x3 (upload to the draft) -> publish (SHA256SUMS +
# make the release public). The release stays a draft until every installer is uploaded,
# so `releases/latest`, the website and install.sh / install.ps1 never see a release
# without assets, and installers.yml (on: release: published) runs against a complete one.
#
# Actions are pinned to a commit SHA (H-14); Dependabot (.github/dependabot.yml) keeps
# them up to date.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Create the release once, before the three builds run in parallel; otherwise each
  # build races to create its own release for the same tag.
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check the ref is a version tag
        run: |
          case "$GITHUB_REF" in
            refs/tags/v*) ;;
            *) echo "::error::Run this workflow from a tag like v1.2.3 (got $GITHUB_REF)"; exit 1 ;;
          esac
      - name: Create draft release
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
              --title "${GITHUB_REF_NAME#v}" --notes "Zinarix Studio ${GITHUB_REF_NAME#v}"

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: --linux AppImage deb pacman
          - os: macos-latest
            target: --mac dmg zip --arm64 --x64
          - os: windows-latest
            target: --win nsis zip --x64
    runs-on: ${{ matrix.os }}
    # The write token is only given to the publishing step: dependency install scripts
    # (pnpm install) and the build never see it.
    permissions:
      contents: write
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - name: Linux packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libarchive-tools
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Code signing is optional and only happens when the secrets exist (otherwise the
      # build is unsigned, as before). scripts/build-editions.mjs turns it on from these
      # variables; see docs/release-signing.md. Each secret only reaches its own runner.
      - name: Build installers
        working-directory: apps/desktop
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS: Developer ID Application certificate (.p12, base64) + notarization.
          CSC_LINK: ${{ runner.os == 'macOS' && secrets.MAC_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ runner.os == 'macOS' && secrets.MAC_CSC_KEY_PASSWORD || '' }}
          APPLE_ID: ${{ runner.os == 'macOS' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ runner.os == 'macOS' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ runner.os == 'macOS' && secrets.APPLE_TEAM_ID || '' }}
          # Windows, option 1: an Authenticode certificate (.pfx, base64) used with signtool.
          WIN_CSC_LINK: ${{ runner.os == 'Windows' && secrets.WIN_CSC_LINK || '' }}
          WIN_CSC_KEY_PASSWORD: ${{ runner.os == 'Windows' && secrets.WIN_CSC_KEY_PASSWORD || '' }}
          # Windows, option 2: Azure Trusted Signing (service principal + account/profile).
          AZURE_TENANT_ID: ${{ runner.os == 'Windows' && secrets.AZURE_TENANT_ID || '' }}
          AZURE_CLIENT_ID: ${{ runner.os == 'Windows' && secrets.AZURE_CLIENT_ID || '' }}
          AZURE_CLIENT_SECRET: ${{ runner.os == 'Windows' && secrets.AZURE_CLIENT_SECRET || '' }}
          AZURE_SIGNING_ENDPOINT: ${{ runner.os == 'Windows' && secrets.AZURE_SIGNING_ENDPOINT || '' }}
          AZURE_SIGNING_ACCOUNT: ${{ runner.os == 'Windows' && secrets.AZURE_SIGNING_ACCOUNT || '' }}
          AZURE_SIGNING_PROFILE: ${{ runner.os == 'Windows' && secrets.AZURE_SIGNING_PROFILE || '' }}
          AZURE_SIGNING_PUBLISHER: ${{ runner.os == 'Windows' && secrets.AZURE_SIGNING_PUBLISHER || '' }}
        # electron-builder's publish config uses releaseType "draft": it uploads to the
        # draft created above and never publishes it. One app per plan: Zinarix Studio
        # (free), Pro, AI and Pro + AI, each with its own installers and update channel.
        run: node scripts/build-editions.mjs -- ${{ matrix.target }} --publish always

  # Runs only when every build succeeded: a failed platform leaves the release as a draft
  # (fix it and re-run the failed job, then this one).
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write # only to dispatch installers.yml below
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      # Only the installers' public key is needed from the repository.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          sparse-checkout: website/install.sh
          sparse-checkout-cone-mode: false
          path: repo
      - name: Generate SHA256SUMS
        run: |
          mkdir assets && cd assets
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --skip-existing
          rm -f SHA256SUMS SHA256SUMS.minisig
          # One "<sha256>  <file name>" line per asset (sha256sum text format).
          sha256sum -- * > ../SHA256SUMS
          cat ../SHA256SUMS
      # H-13: SHA256SUMS is signed with the project's minisign key (docs/release-signing.md);
      # install.sh / install.ps1 verify it with the public key embedded in them. The
      # trusted comment names the tag, so an older signed SHA256SUMS cannot be replayed into
      # a newer release. Legacy (-l, non-prehashed) signatures: SHA256SUMS is tiny and
      # install.ps1 checks plain Ed25519 without any extra tool.
      - name: Sign SHA256SUMS (minisign)
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          PUB="$(sed -n 's/^MINISIGN_PUBKEY="\(.*\)"$/\1/p' repo/website/install.sh)"
          if [ -z "$MINISIGN_SECRET_KEY" ]; then
            # Installers that already embed a real key reject unsigned releases: never
            # publish one. Before the key exists, warn and publish unsigned (as before).
            case "$PUB" in
              RW*) echo "::error::website/install.sh has a minisign public key but the MINISIGN_SECRET_KEY secret is not set"; exit 1 ;;
            esac
            echo "::warning::MINISIGN_SECRET_KEY is not set: SHA256SUMS is published unsigned (see docs/release-signing.md)"
            exit 0
          fi
          sudo apt-get update -qq && sudo apt-get install -y -qq minisign
          umask 077
          key="$RUNNER_TEMP/minisign.key"
          printf '%s\n' "$MINISIGN_SECRET_KEY" > "$key"
          # minisign reads the key password from stdin when it is not a terminal (a key
          # made with `minisign -G -W` has none and ignores it).
          printf '%s\n' "$MINISIGN_PASSWORD" | minisign -S -l -s "$key" -m SHA256SUMS \
            -t "zinarix-studio $GITHUB_REF_NAME SHA256SUMS"
          rm -f "$key"
          # The signature must verify with the key the installers embed (catches a secret
          # and a public key that do not belong together, before anything is published).
          case "$PUB" in
            RW*) minisign -V -P "$PUB" -m SHA256SUMS -x SHA256SUMS.minisig ;;
            *) echo "::warning::website/install.sh still has the placeholder public key: installers will not check this signature yet" ;;
          esac
          cat SHA256SUMS.minisig
      - name: Upload SHA256SUMS
        run: |
          files=(SHA256SUMS)
          [ -f SHA256SUMS.minisig ] && files+=(SHA256SUMS.minisig)
          gh release upload "$GITHUB_REF_NAME" "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber
      - name: Publish release
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest
      # A release published with GITHUB_TOKEN does not trigger other workflows
      # (installers.yml listens to `release: published`), so start the installer tests
      # explicitly; workflow_dispatch is the exception GitHub allows.
      - name: Test the installers against the new release
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: gh workflow run installers.yml --repo "$GITHUB_REPOSITORY" --ref "$DEFAULT_BRANCH"
