# Fase 15: the Zinarix agent in CI. Run it by hand (Actions → "Agente: arreglar pruebas"):
# it runs the tests, lets `omni agent -p` fix what fails, and opens a pull request.
name: 'Agente: arreglar pruebas'

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: Tarea para el agente
        default: 'Corre `pnpm test`. Si alguna prueba falla, arregla el código (no la prueba, salvo que la prueba esté mal) hasta que pase.'
      model:
        description: Modelo (provider/model)
        default: 'anthropic/claude-sonnet-5-5'

permissions:
  contents: write
  pull-requests: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The agent runs commands: keep the token out of .git/config.
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/zinarix-agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        with:
          prompt: ${{ inputs.prompt }}
          model: ${{ inputs.model }}
          approve: full
          open-pr: 'true'
