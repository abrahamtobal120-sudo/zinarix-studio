name: Especial

# Builds the portable, no-UAC Windows .exe "Zinarix Studio Especial" and uploads it as an artifact.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['apps/desktop/scripts/build-especial.mjs', '.github/workflows/especial.yml']

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter @omni/desktop exec node scripts/build-especial.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Zinarix-Studio-Especial
          path: apps/desktop/release/Zinarix-Studio-Especial-*.exe
