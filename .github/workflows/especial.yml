name: Especial

# Builds the portable, no-UAC Windows .exe "Zinarix Studio Especial" and uploads it as an artifact.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['apps/desktop/scripts/build-especial.mjs', '.github/workflows/especial.yml']

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter @omni/desktop exec node scripts/build-especial.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Zinarix-Studio-Especial
          path: apps/desktop/release/Zinarix-Studio-Especial-*.exe
