packages:
  - 'apps/*'
  - 'packages/*'
  - 'catalog'
allowBuilds:
  electron: true
  electron-winstaller: false
  esbuild: true
# Install native prebuilds for both CPU architectures so one macOS runner can package
# Apple Silicon and Intel builds (node-pty, keyring).
supportedArchitectures:
  os: [current]
  cpu: [x64, arm64]
# Security floors for transitive dependencies (see scripts/audit.mjs):
# monaco-editor pins dompurify 3.4.15; electron / node-gyp bring older undici.
overrides:
  dompurify: ^3.4.17
  'undici@>=7 <7.30.2': ^7.30.2
  'undici@>=4 <6.29.1': ^6.29.1
minimumReleaseAgeExclude:
  - electron@44.11.3
